# yaml-language-server: $schema=https://creativeprojects.github.io/resticprofile/jsonschema/config.json
version: "2"

# reusable values
{{ $backup_log_file := "/srv/var/logs/backup_scripts/restic-backup.log" }}
{{ $check_log_file := "/srv/var/logs/backup_scripts/restic-check.log" }}
{{ $status_file := "/srv/var/logs/backup_scripts/restic-status.json" }}
{{ $status_log_file := "/srv/var/logs/backup_scripts/restic-status.json.log" }}

global:
  # priority is using priority class on windows, and "nice" on unixes
  priority: low
  # disks IO priority of restic
  ionice: true
  ionice-class: 2
  ionice-level: 6
  restic-lock-retry-after: 5m
  # Ask restic to unlock a stale lock when its age is more than 2 hours
  # and the option "force-inactive-lock" is enabled in the profile.
  restic-stale-lock-age: 22h

  schedule-defaults:
    after-network-online: true


groups:
  main:
    description: All the main backup groups
    continue-on-error: true
    profiles:
      - imagens
      - srv_docs
      - home_assistant
    schedules:
      backup:
        at: '*-*-* 02:00:00'
        log: '{{ $backup_log_file }}'
      check:
        at: 'Mon,Fri *-*-* 03:00:00'
        log: '{{ $check_log_file }}'


profiles:
  base:
    env-file: ".env"
    repository: "s3:https://s3.amazonaws.com/backup-restic-bucket"
    password-file: "restic_pass.txt"
    status-file: '{{ $status_file }}'
    extended-status: true
    run-finally: 'cat {{ $status_file }} >> {{ $status_log_file }}'
    backup:
      exclude-caches: true
      one-file-system: true
      run-before: 
        - 'echo "" >> {{$backup_log_file}}'
        - 'echo "[$(date -Is)] ====== running $PROFILE_COMMAND on $PROFILE_NAME" >> {{$backup_log_file}}'
      run-finally: 
        - 'echo "[$(date -Is)] ====== finished $PROFILE_COMMAND on $PROFILE_NAME" >> {{$backup_log_file}}'
        - 'echo "" >> {{$backup_log_file}}'
    retention:
      after-backup: true
      prune: true
    check:
      read-data-subset: 1M
      run-before: 
        - 'echo "" >> {{$check_log_file}}'
        - 'echo "[$(date -Is)] ====== running $PROFILE_COMMAND on $PROFILE_NAME" >> {{$check_log_file}}'
      run-finally: 
        - 'echo "[$(date -Is)] ====== finished $PROFILE_COMMAND on $PROFILE_NAME" >> {{$check_log_file}}'
        - 'echo "" >> {{$check_log_file}}'
    force-inactive-lock: true

  srv_docs:
    inherit: base

    backup:
      source:
        - "/mnt/dados/server_docs"
        - "/mnt/dados/kb"

    retention:
      keep-daily: 7
      keep-monthly: 3
      keep-yearly: 1


  imagens:
    inherit: base

    backup:
      source:
        - "/mnt/dados/Imagens"
        - "/mnt/dados/immich-library/library"
        - "/mnt/dados/immich-library/upload"
        - "/mnt/dados/immich-library/profile"
      exclude-file: "/mnt/dados/Imagens/.backupignore"

    check:
      read-data-subset: 20M

    retention:
      keep-daily: 2
      keep-monthly: 12
      keep-yearly: 2


  home_assistant:
    inherit: base

    backup:
      source:
        - "/mnt/dados/HomeAssistantBackups"

    retention:
      keep-weekly: 5
      keep-monthly: 2

